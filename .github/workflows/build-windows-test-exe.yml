name: Build Windows test EXE

on:
  push:
    branches:
      - build/windows-test-exe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Import smoke
        shell: pwsh
        run: |
          python -c "import holding79_transfer; print(holding79_transfer.__version__)"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name HOLDING79_TRANSFER_TEST --paths src tools/windows_test_app.py

      - name: Verify artifact
        shell: pwsh
        run: |
          if (!(Test-Path "dist/HOLDING79_TRANSFER_TEST.exe")) { throw "EXE not produced" }
          Get-Item "dist/HOLDING79_TRANSFER_TEST.exe" | Format-List Name,Length,LastWriteTime
          Get-FileHash "dist/HOLDING79_TRANSFER_TEST.exe" -Algorithm SHA256

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: HOLDING79_TRANSFER_TEST_WINDOWS
          path: dist/HOLDING79_TRANSFER_TEST.exe
          if-no-files-found: error
          retention-days: 7
